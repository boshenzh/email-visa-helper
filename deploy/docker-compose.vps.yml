# Redeploy onto the existing Docker network. Do not create or remove it.
# Credentials stay in the host .env. This file has none.
services:
  visa-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: ../.env
        required: true
    environment:
      DATA_DIR: /data
      LISTEN_HOST: 0.0.0.0
      PORT: "8080"
      PUBLIC_LAUNCH: blocked
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - visa-data:/data
    networks:
      - visa-test-ingress
    read_only: true
    tmpfs:
      - /tmp:size=64m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    restart: unless-stopped

networks:
  visa-test-ingress:
    external: true
    name: visa-test-ingress

volumes:
  visa-data:
